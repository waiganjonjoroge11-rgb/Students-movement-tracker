<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Movement Tracker - Driver</title><style>body{font:16px system-ui;background:#f2f6f9;color:#17334a;margin:0}.bar{background:#123b5d;color:white;padding:16px;display:flex;justify-content:space-between}.bar a{color:white}.wrap{max-width:850px;margin:25px auto;padding:0 14px}.card{background:white;border:1px solid #dfe8ef;border-radius:12px;padding:18px;margin:14px 0}input{display:block;width:100%;padding:12px;margin:5px 0 12px;box-sizing:border-box}button{padding:10px 14px;margin:5px;border:0;border-radius:7px;cursor:pointer;background:#e5edf3}.primary{background:#1266a3;color:white}.student{padding:12px;border-bottom:1px solid #ddd}a{color:#1266a3}#activity{white-space:pre-wrap}</style></head><body><header class="bar"><b>Student Movement Tracker · Driver</b><a href="./monitor.html">Remote monitoring ↗</a></header><main class="wrap"><section id="login" class="card"><h1>Driver sign in</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Sign in</button></form><p id="message"></p></section><section id="app" hidden><div class="card"><h1>Today's student register</h1><button id="logout">Sign out</button><button id="refresh">Refresh students</button><p>Picked up: <b id="picked">0</b> · Absent: <b id="absent">0</b></p><div id="students">Loading…</div></div><div class="card"><h2>Vehicle GPS tracking</h2><p>Location is shared only after you start tracking and allow location permission.</p><button id="gpsStart" class="primary">Start GPS</button><button id="gpsStop" disabled>Stop GPS</button><p id="gpsMessage">GPS off</p></div><div class="card"><h2>Recent activity</h2><div id="activity">No activity yet.</div></div></section></main><script type="module" src="./driver.js"></script></body></html>
