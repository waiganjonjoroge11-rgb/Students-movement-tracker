name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-hosting:
    name: Deploy driver and administrator portals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(p.type!=="service_account" || p.project_id!=="student-movement-tracker" || p.client_email!=="firebase-adminsdk-fbsvc@student-movement-tracker.iam.gserviceaccount.com" || !p.private_key) throw new Error("FIREBASE_SERVICE_ACCOUNT must be a valid key for the expected student-movement-tracker service account");' "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Create missing Firebase Hosting sites
        run: |
          set -euo pipefail
          for site in student-movement-driver student-movement-admin; do
            if firebase hosting:sites:get "$site" --project student-movement-tracker >/dev/null 2>&1; then
              echo "Hosting site $site already exists"
            else
              firebase hosting:sites:create "$site" --project student-movement-tracker --non-interactive
            fi
          done

      - name: Configure Firebase Hosting targets
        run: |
          set -euo pipefail
          firebase target:apply hosting driver student-movement-driver --project student-movement-tracker
          firebase target:apply hosting monitor student-movement-admin --project student-movement-tracker

      - name: Verify Firebase credentials
        run: firebase projects:list --project student-movement-tracker

      - name: Deploy driver and administrator portals
        run: firebase deploy --only hosting:driver,hosting:monitor --project student-movement-tracker --non-interactive

  deploy-firestore-rules:
    name: Deploy Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(p.type!=="service_account" || p.project_id!=="student-movement-tracker" || p.client_email!=="firebase-adminsdk-fbsvc@student-movement-tracker.iam.gserviceaccount.com" || !p.private_key) throw new Error("FIREBASE_SERVICE_ACCOUNT must be a valid key for the expected student-movement-tracker service account");' "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project student-movement-tracker --non-interactive
