name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.22.3

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(p.type!=="service_account" || p.project_id!=="student-movement-tracker" || !p.client_email || !p.private_key) throw new Error("The secret must be a valid service-account JSON key for student-movement-tracker");' "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # The two Hosting sites were created separately in Firebase Console.
      # Applying targets locally avoids requiring site-creation IAM permissions
      # in the deployment service account.
      - name: Configure existing Firebase Hosting targets
        run: |
          set -euo pipefail
          firebase target:apply hosting driver student-movement-driver --project student-movement-tracker
          firebase target:apply hosting monitor student-movement-admin --project student-movement-tracker

      - name: Deploy driver and administrator portals
        run: firebase deploy --only hosting:driver,hosting:monitor --project student-movement-tracker --non-interactive
