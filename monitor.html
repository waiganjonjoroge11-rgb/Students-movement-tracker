<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Tracker - Remote Monitor</title><style>body{font:15px system-ui;background:#f2f6f9;color:#17334a;margin:0}.bar{background:#123b5d;color:white;padding:16px;display:flex;justify-content:space-between}.bar a{color:white}.wrap{max-width:1100px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #dfe8ef;border-radius:12px;padding:18px;margin:14px 0}input{display:block;width:100%;padding:12px;margin:5px 0 12px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:7px;cursor:pointer}.primary{background:#1266a3;color:white}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5ebef}th{background:#f5f8fa}.stats{display:flex;gap:18px;flex-wrap:wrap}.stat{background:#f2f6f9;padding:14px;border-radius:8px;min-width:130px}.stat b{display:block;font-size:24px}a{color:#1266a3}</style></head><body><header class="bar"><b>Student Movement Tracker · Remote Monitor</b><a href="./index.html">Driver app ↗</a></header><main class="wrap"><section id="login" class="card"><h1>Administrator sign in</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Sign in</button></form><p id="message"></p></section><section id="dash" hidden><div class="card"><h1>Remote monitoring dashboard</h1><button id="logout">Sign out</button><button id="refresh">Refresh</button><button id="csv">Download attendance CSV</button><div class="stats"><div class="stat">Students<b id="total">0</b></div><div class="stat">Picked up<b id="picked">0</b></div><div class="stat">Absent<b id="absent">0</b></div></div></div><section class="card"><h2>Today's attendance</h2><div class="table"><table><thead><tr><th>Time</th><th>Student</th><th>Status</th><th>Recorded by</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></section><section class="card"><h2>Latest movement and GPS events</h2><div class="table"><table><thead><tr><th>Time</th><th>Event</th><th>Student / driver</th><th>Map</th></tr></thead><tbody id="movementRows"></tbody></table></div></section><section class="card"><h2>Students</h2><div class="table"><table><thead><tr><th>Name</th><th>Class</th><th>Route</th><th>Parent contact</th></tr></thead><tbody id="studentRows"></tbody></table></div></section></section></main><script type="module" src="./monitor.js"></script></body></html>
